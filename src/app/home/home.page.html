<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title> Aplicacion de Tareas </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item>
    <ion-label position="stacked"> Nueva tarea </ion-label>
    <ion-input [(ngModel)] = "newTaskStr" placeholder="Ingrese el titulo de la tarea"></ion-input>
  </ion-item>

  <ion-button expand = "block" color="secondary" (click) = "addTask()"> Agregar tarea </ion-button>

  <ion-list>
    @for(task of tasks; track task.titulo){
      <ion-item>
        <ion-label> {{task.titulo}} </ion-label>
      </ion-item>
    }
  </ion-list>

</ion-content>
